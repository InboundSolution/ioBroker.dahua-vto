name: Test and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run package tests
        run: npm run test:package
      - name: Run unit tests
        run: npm run test:unit

  # Publishing in das ioBroker-Repository erfolgt manuell über
  # https://github.com/ioBroker/ioBroker.repositories (PR) – dieser Adapter
  # ist derzeit privat und wird über die GitHub-URL installiert.
